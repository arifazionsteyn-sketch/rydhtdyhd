<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUCENTO — Сеть партнёров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1d0a12; --card:#22101a; --line:rgba(212,168,90,.22);
  --gold:#d4a85a; --gold-hi:#e9c67e; --gold-dk:#a8823f;
  --wine:#6b2233; --wine-hi:#8a3348; --wine-dk:#4a1622;
  --text:#f0e2d0; --muted:#b39c8a; --ink:#2a1218;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif}
a{color:inherit}
.top{display:flex;align-items:center;gap:32px;padding:20px 5vw;border-bottom:1px solid var(--line)}
.top .logo{font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:.14em;text-decoration:none;color:var(--gold)}
.top nav{display:flex;gap:24px;flex-wrap:wrap}
.top nav a{text-decoration:none;color:var(--muted);font-size:14px}
.top nav a.on,.top nav a:hover{color:var(--gold-hi)}

.eyebrow{color:var(--gold-dk);font-weight:600;font-size:14px;letter-spacing:.04em}
h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(34px,5vw,48px);margin:6px 0 14px}
.lead{color:var(--muted);max-width:640px;line-height:1.7;margin:0 0 36px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.mapcard{position:relative;padding:18px 18px 0;overflow:hidden}
#map{display:block;width:100%;height:auto;touch-action:manipulation}
#map .d{stroke-width:.8;vector-effect:non-scaling-stroke;transition:opacity .5s,fill .25s;cursor:pointer}
#map .free{fill:var(--gold);stroke:var(--gold)}
#map .taken{fill:var(--wine);stroke:var(--wine)}
#map.l0 .free.hl{fill:var(--gold-hi);stroke:var(--gold-hi)}
#map.l0 .taken.hl{fill:var(--wine-hi);stroke:var(--wine-hi)}
#map .regmesh{fill:none;stroke:var(--bg);stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none;transition:opacity .5s}
#map .outline{fill:none;stroke:var(--bg);stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
/* level 2 (inside region) */
#map.l1 .d{opacity:.13;pointer-events:none}
#map.l1 .d.sel{opacity:1;pointer-events:auto;stroke:var(--bg);stroke-width:1.4}
#map.l1 .d.sel.free:hover,#map.l1 .d.sel.free.hl{fill:var(--gold-hi)}
#map.l1 .d.sel.taken:hover,#map.l1 .d.sel.taken.hl{fill:var(--wine-hi)}
#map.l1 .regmesh{opacity:0}
/* markers */
.mk{cursor:pointer;outline:none}
.mk .bub{fill:var(--bg);stroke:var(--gold-hi);stroke-width:2;transition:fill .2s}
.mk text{fill:var(--gold-hi);font:700 12.5px 'Manrope',sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk.taken .bub{fill:var(--gold);stroke:var(--bg)}
.mk.taken text{fill:var(--ink)}
.mk.empty text{opacity:.55}
.mk:hover .bub,.mk:focus-visible .bub{fill:var(--wine)}
.mk.taken:hover .bub,.mk.taken:focus-visible .bub{fill:var(--gold-hi)}
.mk .pin{fill:var(--bg);stroke:var(--gold-hi);stroke-width:2}
.mk .halo{fill:none;stroke:var(--gold-hi);stroke-width:1.5;opacity:0}
.mk.active .halo{opacity:.9}
.back{position:absolute;left:28px;top:26px;z-index:3;display:none;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;
  background:rgba(29,10,18,.85);border:1px solid var(--line);color:var(--gold-hi);font:600 13px 'Manrope',sans-serif;cursor:pointer;backdrop-filter:blur(4px)}
.back:hover{border-color:var(--gold)}
.back.show{display:inline-flex}
.legend{display:flex;gap:26px;flex-wrap:wrap;margin:14px 0 0;padding:16px 4px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:9px;vertical-align:-2px}
.tip{position:absolute;z-index:4;pointer-events:none;background:rgba(29,10,18,.94);border:1px solid var(--line);color:var(--text);
  font-size:13px;padding:6px 10px;border-radius:6px;white-space:nowrap;opacity:0;transition:opacity .12s;transform:translate(-50%,-140%)}
.tip.show{opacity:1}
.tip small{color:var(--muted);margin-left:6px}
/* popover */
.pop{position:absolute;z-index:6;width:250px;background:var(--card);border:1px solid var(--gold-dk);border-radius:10px;padding:14px 16px 14px;
  box-shadow:0 12px 34px rgba(0,0,0,.55);transform:translate(-50%,-100%);display:none}
.pop.show{display:block}
.pop.below{transform:translate(-50%,0)}
.pop h4{margin:0 22px 2px 0;font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600}
.pop .sub{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.pop .x{position:absolute;right:8px;top:6px;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
.pop .ag{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.pop .ag b{display:block;font-weight:600;margin-bottom:3px}
.pop .ag a{color:var(--gold-hi);text-decoration:none;display:block;line-height:1.7}
.pop .ag a:hover{text-decoration:underline}
.pop .none{color:var(--muted);font-size:14px;line-height:1.5;padding-top:10px;border-top:1px solid var(--line)}
/* info card */
.info{padding:28px 28px 30px;min-height:230px}
.info .eyebrow{font-weight:500;color:var(--gold-dk);font-size:14px}
.info h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:30px;margin:8px 0 12px}
.info p{color:var(--muted);line-height:1.7;margin:0 0 14px;font-size:15px}
.badge{display:inline-block;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:14px}
.badge.free{background:rgba(212,168,90,.16);color:var(--gold-hi);border:1px solid var(--gold-dk)}
.badge.taken{background:rgba(138,51,72,.3);color:#f0b9c4;border:1px solid var(--wine-hi)}
.stats{display:flex;gap:22px;margin:4px 0 16px}
.stats div{font-size:13px;color:var(--muted)}
.stats b{display:block;font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:500;color:var(--gold-hi);line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:7px;max-height:210px;overflow:auto;padding-right:4px}
.chip{border:1px solid var(--line);background:none;color:var(--text);border-radius:999px;padding:5px 11px;font:500 12.5px 'Manrope',sans-serif;cursor:pointer}
.chip:hover{border-color:var(--gold);color:var(--gold-hi)}
.chip em{font-style:normal;color:var(--gold);margin-left:6px}
.note{margin-top:22px;color:var(--muted);font-size:12px;opacity:.7}
footer{padding:26px 5vw;border-top:1px solid var(--line);color:var(--muted);font-size:13px}

.wrap{max-width:1240px;margin:0 auto;padding:24px 20px}
html,body{background:var(--bg)}

/* иконка человека */
.mk .ppl{fill:none;stroke:var(--gold-hi);stroke-width:1.8;stroke-linejoin:round;pointer-events:none}
.mk.taken .ppl{stroke:var(--ink)}
.mk .bpin{fill:var(--wine);stroke:var(--gold-hi);stroke-width:2;stroke-linejoin:round;transition:fill .2s}
.mk .bdot{fill:var(--gold-hi);pointer-events:none}
.mk.pinmk:hover .bpin,.mk.pinmk:focus-visible .bpin{fill:var(--wine-hi)}
/* ===== v2: во весь экран, филиалы, легенда ===== */
.wrap{max-width:none;padding:14px 16px}
.grid{position:relative;column-gap:24px;transition:grid-template-columns .9s cubic-bezier(.65,0,.35,1),column-gap .9s}
.grid.wide{grid-template-columns:minmax(0,1fr) 0px;column-gap:0}
.grid.wide .info{position:absolute;right:34px;top:34px;width:320px;max-height:calc(100% - 190px);overflow:auto;min-height:0;padding:22px;z-index:5;background:rgba(34,16,26,.95);backdrop-filter:blur(6px);box-shadow:0 12px 34px rgba(0,0,0,.45)}
#map{height:clamp(520px,46vw,900px)}
@media(max-width:900px){
  .grid,.grid.wide{grid-template-columns:1fr;column-gap:0;row-gap:16px}
  .grid.wide .info{position:static;width:auto;max-height:none}
  #map{height:calc((100vw - 68px)/1.52)}
  #map.l1{height:clamp(420px,110vw,720px)}
}
.bk{cursor:pointer;outline:none}
.bk .bpin{fill:var(--wine);stroke:var(--gold-hi);stroke-width:2;stroke-linejoin:round;transition:fill .2s}
.bk .bdot{fill:var(--gold-hi);pointer-events:none}
.bk:hover .bpin,.bk:focus-visible .bpin,.bk.active .bpin{fill:var(--wine-hi)}
.bk .bring{fill:none;stroke:var(--gold-hi);stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:bp 2.2s ease-out infinite;pointer-events:none}
@keyframes bp{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.legend{gap:14px 34px;align-items:center}
.lg{display:inline-flex;align-items:center;gap:10px}
.lg svg{flex:none;display:block}
.pop .addr{font-size:14px;line-height:1.5;margin:4px 0 4px}
.pop .hint{color:var(--gold-hi);font-size:12.5px;margin-bottom:6px}
.pop .btn{display:block;text-align:center;padding:9px 12px;border-radius:8px;border:1px solid var(--gold-dk);color:var(--gold-hi);text-decoration:none;font:600 13px 'Manrope',sans-serif;margin-top:8px}
.pop .btn:hover{border-color:var(--gold);text-decoration:none}
.pop .btn.gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--ink);border-color:var(--gold)}
.branch{display:block;width:100%;text-align:left;background:rgba(107,34,51,.28);border:1px solid var(--wine-hi);border-radius:8px;padding:10px 12px;margin-bottom:8px;color:var(--text);cursor:pointer;font:500 13px 'Manrope',sans-serif}
.branch:hover{border-color:var(--gold)}
.branch b{display:block;color:var(--gold-hi);font-weight:600;margin-bottom:2px}
.branch span{color:var(--muted);font-size:12px;line-height:1.4}

/* ===== v4: панель справа всегда по высоте карты — раскладка не прыгает при наведении ===== */
@media(min-width:901px){
  .grid:not(.wide){align-items:stretch}
  .grid:not(.wide) .info{contain:size;overflow:auto;min-height:0}
}
/* золотой блик по обводке при переключении режима */
.shine{opacity:0;pointer-events:none}
.shine .shl{fill:none;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.shine .shl.base{stroke:url(#shGd);stroke-width:5}
.shine .shl.core{stroke:url(#shG);stroke-width:2.6}
/* ===== v3: переключатель «Наши партнёры» и метки партнёров ===== */
.ptoggle{position:relative;flex:none;display:inline-flex;align-items:center;gap:9px;padding:7px 12px 7px 14px;border-radius:999px;
  background:rgba(29,10,18,.85);border:1px solid var(--line);color:var(--muted);font:600 12.5px 'Manrope',sans-serif;cursor:pointer;backdrop-filter:blur(4px);
  transition:border-color .2s,color .2s}
.ptoggle:hover{border-color:var(--gold-dk)}
.ptoggle .sw{position:relative;flex:none;width:32px;height:18px;border-radius:999px;background:rgba(179,156,138,.22);border:1px solid var(--line);transition:background .2s,border-color .2s}
.ptoggle .sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:transform .22s,background .2s}
.ptoggle[aria-checked="true"]{color:var(--gold-hi);border-color:var(--gold-dk)}
.ptoggle[aria-checked="true"] .sw{background:rgba(212,168,90,.3);border-color:var(--gold-dk)}
.ptoggle[aria-checked="true"] .sw::after{transform:translateX(14px);background:var(--gold-hi)}
.mapctl{position:absolute;right:28px;top:26px;z-index:8;display:flex;gap:10px;align-items:flex-start;pointer-events:none;transition:right .9s cubic-bezier(.65,0,.35,1)}
.mapctl>*{pointer-events:auto}
.grid.wide .mapctl{right:372px}
@media(max-width:900px){.grid.wide .mapctl{right:28px}}
/* поиск по партнёрам */
.psearch{position:relative;width:230px}
.psearch input{width:100%;height:34px;padding:0 12px 0 34px;border-radius:999px;background:rgba(29,10,18,.88);border:1px solid var(--line);color:var(--text);font:500 13px 'Manrope',sans-serif;outline:none;backdrop-filter:blur(4px);transition:border-color .2s}
.psearch input::placeholder{color:var(--muted)}
.psearch input:focus{border-color:var(--gold)}
.psearch>svg{position:absolute;z-index:1;left:12px;top:10px;pointer-events:none;color:var(--gold-dk)}
.pres{display:none;position:absolute;right:0;top:40px;width:300px;max-width:calc(100vw - 40px);background:var(--card);border:1px solid var(--gold-dk);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.55);overflow:auto;max-height:340px}
.pres.show{display:block}
.pres button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;color:var(--text);cursor:pointer;font:500 13px 'Manrope',sans-serif}
.pres button:last-child{border-bottom:0}
.pres button:hover,.pres button.on{background:rgba(107,34,51,.38)}
.pres img,.pres .rg{width:28px;height:28px;border-radius:50%;flex:none;border:1.5px solid var(--gold-hi)}
.pres img{background:#fff;object-fit:cover}
.pres .rg{display:grid;place-items:center;color:var(--gold-hi);border-color:var(--gold-dk)}
.pres b{display:block;font-weight:600;color:var(--gold-hi);font-size:13px}
.pres span{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.pres .none{padding:12px 14px;color:var(--muted);font-size:13px}
.pres .phd{padding:10px 14px 4px;color:var(--gold-dk);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
@media(max-width:600px){.mapctl{left:16px;right:16px;flex-wrap:wrap;justify-content:flex-end}.grid.wide .mapctl{right:16px}.psearch{order:2;flex:1 1 100%;width:auto}.pres{width:auto;left:0}}
/* фильтр по бренду (клик на логотип в легенде) */
.lgb{background:none;border:0;padding:3px 9px 3px 4px;border-radius:999px;color:inherit;font:inherit;cursor:pointer;transition:opacity .2s,background .2s,color .2s}
.lgb:hover{background:rgba(212,168,90,.1)}
.lgb.on{background:rgba(212,168,90,.18);color:var(--gold-hi)}
.legend.pf .lgb:not(.on){opacity:.4}
.lgn{color:var(--muted);font-weight:500}
.lgb.on .lgn{color:var(--gold-hi)}
.lgb:focus-visible{outline:2px solid var(--gold-dk)}
.pfreset{margin:2px 0 0;background:none;border:1px solid var(--gold-dk);color:var(--gold-hi);border-radius:999px;padding:6px 14px;font:600 12.5px 'Manrope',sans-serif;cursor:pointer}
.pfreset:hover{border-color:var(--gold)}
/* кнопка «Позвонить» */
.pop .ptel{color:var(--muted);font-size:13px;margin-top:2px}
.pop .pphoto{display:block;width:100%;height:112px;object-fit:cover;border-radius:8px;border:1px solid var(--line);margin:0 0 9px;background:var(--wine-dk)}
.pop .pbtns{display:flex;gap:8px;margin-top:8px}
.pop .pbtns .btn{flex:1;margin-top:0;padding:8px 10px;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.legend:not(.pmode) .lg[data-mode="partners"]{display:none}
.legend.pmode .lg[data-mode="agents"]{display:none}
.lgimg{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--gold-hi);background:#fff;object-fit:cover;flex:none}
/* метки партнёров на карте */
.pm{cursor:pointer;outline:none}
.pm .pbg{fill:#fff;stroke:var(--gold-hi);stroke-width:2.2;transition:stroke .2s,stroke-width .2s}
.pm .pb{transition:filter .25s}
.pm:hover .pbg,.pm:focus-visible .pbg{stroke:#fff;stroke-width:3}
.pm .plead{stroke:var(--gold-hi);stroke-width:1.4;opacity:.85;pointer-events:none}
.pm .pdot{fill:var(--gold-hi);stroke:var(--bg);stroke-width:1.2;pointer-events:none}
.pm .pglow{fill:none;stroke:var(--gold-hi);stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center;pointer-events:none}
.pm.active .pglow{opacity:1;animation:pglow 1.8s ease-in-out infinite}
.pm.active .pb{filter:drop-shadow(0 0 7px rgba(233,198,126,.95)) drop-shadow(0 0 16px rgba(233,198,126,.55))}
.pm.active .pbg{stroke:#fff;stroke-width:3}
@keyframes pglow{0%,100%{transform:scale(1);stroke-opacity:.95}50%{transform:scale(1.16);stroke-opacity:.3}}
.pm .pcnt{fill:var(--wine);stroke:var(--gold-hi);stroke-width:1.6}
.pm text{fill:#fff;font:700 11px 'Manrope',sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
@media(prefers-reduced-motion:reduce){.pm.active .pglow{animation:none}}
/* окно партнёра */
.pop.p{width:290px}
.pop .phead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.pop .phead h4{margin:0 22px 2px 0}
.plogo{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--gold-hi);background:#fff;object-fit:cover;box-shadow:0 0 16px rgba(233,198,126,.6)}
.plogo.sm{width:30px;height:30px;border-width:1.5px;box-shadow:0 0 8px rgba(233,198,126,.35)}
.plist{max-height:250px;overflow:auto;padding-right:2px}
.pop .pi{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.pop .pi b{display:block;font-weight:600;margin-bottom:3px}
.pop .pi .tel{display:block;color:var(--gold-hi);text-decoration:none;line-height:1.7}
.pop .pi .tel:hover{text-decoration:underline}
.pop .pi .btn{margin-top:8px;padding:8px 10px;font-size:12.5px}
.pop .pi .addr{font-size:13px;color:var(--muted);line-height:1.45}
.pgrp{display:flex;align-items:center;gap:10px;margin:18px 0 9px;color:var(--gold-hi);font-weight:600;font-size:14px;letter-spacing:.02em}
.lang{flex:none;display:inline-flex;height:34px;padding:3px;border-radius:999px;background:rgba(29,10,18,.88);border:1px solid var(--line);backdrop-filter:blur(4px)}
.lang button{border:0;background:none;color:var(--muted);font:700 11.5px 'Manrope',sans-serif;padding:0 10px;border-radius:999px;cursor:pointer;letter-spacing:.04em}
.lang button:hover{color:var(--gold-hi)}
.lang button.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--ink)}
/* скроллбары в гамме сайта (без белых краёв и стрелок) */
:root{color-scheme:dark}
*{scrollbar-width:thin;scrollbar-color:var(--gold-dk) transparent}
@supports not (scrollbar-color:auto){
  *::-webkit-scrollbar{width:8px;height:8px;background:transparent}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:var(--gold-dk);border-radius:999px}
  *::-webkit-scrollbar-thumb:hover{background:var(--gold)}
  *::-webkit-scrollbar-button{display:none;width:0;height:0}
  *::-webkit-scrollbar-corner{background:transparent}
}

/* ===== Один файл: стартовая страница + карта ===== */
#mapview{position:fixed;inset:0;z-index:30;overflow:auto;background:var(--bg);visibility:hidden;opacity:0;will-change:opacity;transition:opacity .8s ease,visibility 0s .8s}
#mapview.on{visibility:visible;opacity:1;transition:opacity 1.3s cubic-bezier(.4,0,.2,1)}
@media(min-width:901px){#mapview .wrap{padding:12px 14px}#mapview #map{height:calc(100vh - 128px);min-height:460px}}
.home{flex:none;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 15px 0 12px;border-radius:999px;background:rgba(29,10,18,.88);border:1px solid var(--line);color:var(--muted);font:600 12.5px 'Manrope',sans-serif;cursor:pointer;backdrop-filter:blur(4px);transition:color .2s,border-color .2s}
.home:hover{color:var(--gold-hi);border-color:var(--gold-dk)}
#landing{position:relative;min-height:100vh;overflow-x:hidden;background:radial-gradient(900px 640px at 80% 45%,rgba(107,34,51,.5),transparent 65%),radial-gradient(700px 500px at 0 0,rgba(212,168,90,.07),transparent 60%),var(--bg)}
#landing.off{display:none}
#landing .fd{transition:opacity .9s ease,transform 1.1s ease}
#landing.going .fd{opacity:0;transform:translateY(-10px);pointer-events:none}
#landing.going #dots{opacity:0;transition:opacity .5s}
#landing .uz{transition:opacity .9s ease}
#landing.going .uz{opacity:0;transition:none}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#landing header,#landing main,#landing footer{position:relative;z-index:1}
#landing header{display:flex;justify-content:flex-end;align-items:center;padding:26px 5vw}
#landing .logo{font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:.14em;color:var(--gold);text-decoration:none}
#landing .lang{display:inline-flex;height:auto;padding:3px;border-radius:999px;border:1px solid var(--line);background:rgba(29,10,18,.7)}
#landing .lang button{padding:7px 12px}
#landing main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:4vw;align-items:center;max-width:1500px;margin:0 auto;padding:2vh 5vw 8vh;min-height:calc(100vh - 150px)}
#landing .leb{display:flex;align-items:center;gap:14px;color:var(--gold-dk);font-weight:600;font-size:12.5px;letter-spacing:.22em;text-transform:uppercase}
#landing .leb::before{content:"";width:44px;height:1px;background:var(--gold-dk)}
#landing h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(42px,5.6vw,84px);line-height:1.03;letter-spacing:-.01em;margin:22px 0 24px}
#landing h1 em{font-style:italic;color:var(--gold-hi)}
#landing .lld{max-width:520px;margin:0;color:var(--muted);font-size:17px;line-height:1.75}
.cta{position:relative;display:inline-flex;align-items:center;gap:16px;margin-top:40px;padding:20px 34px;border-radius:999px;border:1px solid var(--gold);overflow:hidden;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,var(--gold-dk));color:var(--ink);font:700 15px 'Manrope',sans-serif;letter-spacing:.03em;text-decoration:none;
  box-shadow:0 14px 40px rgba(212,168,90,.18),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .25s,box-shadow .25s}
.cta::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg)}
.cta:hover::after{left:130%;transition:left .8s ease}
.cta:hover{box-shadow:0 18px 50px rgba(212,168,90,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.cta:active{transform:translateY(1px)}
.cta:focus-visible{outline:2px solid var(--gold-hi);outline-offset:4px}
.cta svg{transition:transform .25s}.cta:hover svg{transform:translateX(5px)}
#landing .lhn{margin:16px 0 0 6px;color:var(--muted);font-size:13px;opacity:.8}
#landing .lst{display:flex;flex-wrap:wrap;gap:20px 52px;margin:56px 0 0;padding-top:28px;border-top:1px solid var(--line);max-width:560px}
#landing .lst b{display:block;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:48px;line-height:1;color:var(--gold-hi)}
#landing .lst span{display:block;margin-top:8px;color:var(--muted);font-size:13px}
#landing .vis{position:relative;z-index:2}
#vsvg{display:block;width:100%;height:auto;overflow:visible}
#fly{position:fixed;z-index:40;pointer-events:none;overflow:visible;transform-origin:0 0;will-change:transform,opacity}
.uz{fill:none;stroke:var(--gold);stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linejoin:round;filter:drop-shadow(0 0 14px rgba(212,168,90,.35))}
.dot{fill:var(--gold-hi)}
.halo{fill:none;stroke:var(--gold-hi);stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:pl 3.2s ease-out infinite}
@keyframes pl{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
#landing footer{padding:24px 5vw;border:0;color:var(--muted);font-size:12.5px;opacity:.7}
@media(max-width:900px){#landing main{grid-template-columns:1fr;padding-bottom:6vh}#landing .vis{order:-1;max-width:520px}.cta{width:100%;justify-content:center;padding:19px 24px}}
@media(prefers-reduced-motion:reduce){.halo{animation:none}}

/* ===== Вход на карту: настоящая карта «вырастает» из золотого силуэта ===== */
#mapview.enter{visibility:visible;opacity:1;transition:none;background:transparent;overflow:hidden}
#mapview.enter .mapcard{overflow:visible;background:transparent;border-color:transparent}
#mapview.enter #map{pointer-events:none;will-change:transform,opacity}
#mapview.enter .mapctl,#mapview.enter .back,#mapview.enter .legend,#mapview.enter .info{opacity:0}
#mapview.enter.chrome{background:var(--bg);transition:background-color 1.4s ease}
#mapview.enter.chrome .mapcard{background:var(--card);border-color:var(--line);transition:background-color 1.4s ease,border-color 1.4s ease}
#mapview.enter.chrome .mapctl,#mapview.enter.chrome .back,#mapview.enter.chrome .legend,#mapview.enter.chrome .info{opacity:1;transition:opacity 1.2s ease .35s}
</style>
</head>

   ? '<span class="badge taken">'+t('b_taken')+'</span>'
   : '<span class="badge free">'+t('b_free')+'</span>';
}
function showRegionInfo(code,preview){
  const r=R[code], nd=r.n, na=rCount(code);
  if(pm){
    const ps=PP.filter(p=>p.region===code&&pvis(p));
    let h='<div class="eyebrow">'+t('reg')+'</div><h2>'+esc(rn(r))+'</h2>'+statusBlock(code);
    h+='<div class="stats"><div><b>'+ps.length+'</b>'+t('s_pts')+'</div><div><b>'+nd+'</b>'+t('s_dist')+'</div></div>';
    if(preview) h+='<p>'+(ps.length?t('pz'):t('nopts'))+'</p>';
    else if(ps.length){h+='<p style="margin-bottom:10px">'+t('ptsopen')+'</p>'; ps.forEach(p=>{h+=pBtn(p)})}
    else h+='<p>'+t('nopts')+'</p>';
    info.innerHTML=h; return;
  }
  let h='<div class="eyebrow">'+t('reg')+'</div><h2>'+esc(rn(r))+'</h2>'+statusBlock(code);
  h+='<div class="stats"><div><b>'+na+'</b>'+t('s_ag')+'</div><div><b>'+nd+'</b>'+t('s_dist')+'</div></div>';
  if(preview){
    h+='<p>'+(status(code)==='taken'?t('ex_t'):t('ex_f'))+' '+t('zoomd')+'</p>';
    const nb=BR.filter(b=>b.region===code).length; if(nb) h+='<p>'+t('hasbr',{n:nb})+'</p>';
  } else {
    const bs=BR.filter(b=>b.region===code);
    if(bs.length){h+='<p style="margin-bottom:10px">'+t('ourbr')+'</p>';bs.forEach(b=>{h+='<button class="branch" type="button" data-b="'+b.id+'"><b>'+esc(bn(b))+'</b><span>'+esc(b.address)+'</span></button>'});}
    h+='<p style="margin:14px 0 10px">'+t('dclick')+'</p><div class="chips">';
    D.districts.filter(d=>d.region===code).forEach(d=>{
      h+='<button class="chip" type="button" data-id="'+d.id+'">'+esc(dn(d))+'<em>'+dCount(d.id)+'</em></button>';
    });
    h+='</div>';
  }
  info.innerHTML=h;
}
info.addEventListener('click',e=>{
  const pb=e.target.closest('.pbtn'); if(pb){focusPartner(PP.find(x=>x.id===pb.dataset.p));return}
  if(e.target.closest('.pfreset')){setFilter(null);return}
  const bb=e.target.closest('.branch'); if(bb){const b=BR.find(x=>x.id===bb.dataset.b); if(b) openBranch(b); return}
  const c=e.target.closest('.chip'); if(!c) return;
  const d=D.districts.find(x=>x.id===c.dataset.id); if(d) openPop(d);
});

let activeMk=null;
function closePop(){pop.classList.remove('show','p'); if(activeMk){activeMk.classList.remove('active');activeMk=null}}
function openPop(d){
  if(level!==1 || q<.95 || pm) return;
  closePop(); hideTip();
  const ags=dAgents(d.id); popCtx={region:d.region,name:dn(d)}; track('district',{region:d.region,point:d.name});
  let h='<button class="x" type="button" aria-label="'+t('close')+'">×</button><h4>'+esc(dn(d))+'</h4><div class="sub">'+esc(rn(R[d.region]))+' · '+t('agn',{n:ags.length})+'</div>';
  if(!ags.length) h+='<div class="none">'+t('noag')+'</div>';
  ags.forEach(a=>{
    h+='<div class="ag" data-agent="'+esc(a.name||'')+'"><b>'+esc(a.name||t('agent'))+'</b>';
    if(a.phone) h+='<a href="tel:'+esc(String(a.phone).replace(/[^\d+]/g,''))+'">'+esc(a.phone)+'</a>';
    if(a.telegram) h+='<a target="_blank" rel="noopener" href="https://t.me/'+esc(String(a.telegram).replace(/^@/,''))+'">'+esc(a.telegram)+'</a>';
    if(a.email) h+='<a href="mailto:'+esc(a.email)+'">'+esc(a.email)+'</a>';
    h+='</div>';
  });
  pop.innerHTML=h; pop.classList.add('show');
  d.mk.classList.add('active'); activeMk=d.mk;
  const cr=card.getBoundingClientRect(), mr=d.mk.getBoundingClientRect();
  let x=mr.left+mr.width/2-cr.left, y=mr.top-cr.top-6;
  const half=125; x=Math.max(half+8,Math.min(cr.width-half-8,x));
  const below=y<pop.offsetHeight+16;
  pop.classList.toggle('below',below);
  pop.style.left=x+'px'; pop.style.top=(below?mr.bottom-cr.top+6:y)+'px';
}
function openBranch(b){
  if(level!==1||q<.95||pm) return;
  closePop(); hideTip();
  popCtx={region:b.region,name:b.name}; track('branch',{region:b.region,point:b.name});
  const route='https://www.google.com/maps/dir/?api=1&destination='+b.lat+','+b.lng;
  let h='<button class="x" type="button" aria-label="'+t('close')+'">×</button><h4>'+esc(bn(b))+'</h4><div class="sub">LUCENTO · '+esc(dn(byId[b.district]))+'</div>'

   +'<a class="btn gold" target="_blank" rel="noopener" href="'+route+'">'+t('route')+'</a>'
   +'<a class="btn" target="_blank" rel="noopener" href="'+esc(b.url)+'">'+t('opengm')+'</a>';
  pop.innerHTML=h; pop.classList.add('show'); b.mk.classList.add('active'); activeMk=b.mk;
  const cr=card.getBoundingClientRect(), mr=b.mk.getBoundingClientRect();
  let x=mr.left+mr.width/2-cr.left, y=mr.top-cr.top-6; const half=125; x=Math.max(half+8,Math.min(cr.width-half-8,x));
  const below=y<pop.offsetHeight+16; pop.classList.toggle('below',below);
  pop.style.left=x+'px'; pop.style.top=(below?mr.bottom-cr.top+6:y)+'px';
}

/* поиск: города, области, районы и партнёры (кириллица и латиница равнозначны) */
const CYR={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'j','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'c','ч':'c','ш':'s','щ':'s','ъ':'','ы':'i','ь':'','э':'e','ю':'u','я':'a','қ':'k','ў':'u','ғ':'g','ҳ':'h'};
const norm=s=>String(s||'').toLowerCase().replace(/[ʻʼ'’‘`]/g,'').replace(/[а-яёқўғҳ]/g,c=>CYR[c]!==undefined?CYR[c]:c)
  .replace(/kh/g,'h').replace(/x/g,'h').replace(/q/g,'k').replace(/sh/g,'s').replace(/ch/g,'c').replace(/ts/g,'c').replace(/[^a-z0-9]+/g,' ').trim();
PP.forEach(p=>{p._h=norm([p.title,p.city||'',p.address,p.maps||'',(PB[p.brand]||{}).name||'',rnA(R[p.region]),ptL(p,'uz'),ptL(p,'en')].join(' '))});
const CT=[];   // города, где есть партнёры
PP.forEach(p=>{
  const nm=p.city||p.title; let c=CT.find(x=>x.name===nm&&x.region===p.region);
  if(!c){c={name:nm,region:p.region,items:[],_h:norm(nm+' '+trs(nm,'uz')+' '+trs(nm,'en')+' '+rnA(R[p.region])),_n:norm(nm)}; CT.push(c)}
  c.items.push(p);
});
D.districts.forEach(d=>{d._h=norm(L3.map(l=>dnL(d,l)).join(' '))});
const ICON_PIN='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>';
let resList=[], resOn=-1;
function hideRes(){pres.classList.remove('show'); pres.innerHTML=''; resList=[]; resOn=-1}
function runSearch(){
  const q=norm(psq.value); let h='';
  resList=[]; resOn=-1;
  if(!q){
    if(document.activeElement!==psq){hideRes();return}
    CT.forEach(c=>resList.push({kind:'c',c:c}));
    h='<div class="phd">'+t('cities')+'</div>';
  } else {
    const toks=q.split(' '), ok=x=>toks.every(w=>x.indexOf(w)>-1);
    const cs=CT.filter(c=>ok(c._h)), csn=new Set(cs.map(c=>c._n));
    cs.forEach(c=>resList.push({kind:'c',c:c}));
    D.regions.forEach(r=>{const n=norm(r.name); if(ok(norm(rnA(r)))&&!csn.has(n)) resList.push({kind:'r',r:r})});
    PP.forEach(p=>{
      if(!ok(p._h)) return;
      const c=CT.find(x=>x.name===(p.city||p.title)&&x.region===p.region);
      if(c&&cs.includes(c)&&c.items.length===1) return;
      resList.push({kind:'p',p:p});
    });
    D.districts.forEach(d=>{if(ok(d._h)&&!csn.has(d._h.replace(/^g /,''))) resList.push({kind:'d',d:d})});
  }
  resList=resList.slice(0,q?8:12);
  resList.forEach((o,i)=>{
    const rg=n=>'<span class="rg">'+ICON_PIN+'</span><div><b>'+esc(n[0])+'</b><span>'+esc(n[1])+'</span></div>';
    if(o.kind==='c') h+='<button type="button" data-i="'+i+'">'+rg([cn(o.c),(R[o.c.region].name===o.c.name?t('city'):rn(R[o.c.region]))+' · '+t('ptsn',{n:o.c.items.length})])+'</button>';
    else if(o.kind==='r'){const n=PP.filter(p=>p.region===o.r.id).length; h+='<button type="button" data-i="'+i+'">'+rg([rn(o.r),t('oblast')+(n?' · '+t('ptsn',{n:n}):'')])+'</button>'}
    else if(o.kind==='d') h+='<button type="button" data-i="'+i+'">'+rg([dn(o.d),t('district')+' · '+rn(R[o.d.region])])+'</button>';
    else h+='<button type="button" data-i="'+i+'"><img src="'+logoOf(o.p.brand)+'" alt=""><div><b>'+esc(pt(o.p))+'</b><span>'+esc((PB[o.p.brand]||{}).name||'')+' · '+esc(rn(R[o.p.region]))+'</span></div></button>';
  });
  pres.innerHTML=h||'<div class="none">'+t('nf')+'</div>';
  pres.classList.add('show');
}
/* выбор результата: если в этом месте есть партнёры — режим «Наши партнёры» включается сам */
function pickRes(o){
  hideRes(); psq.value=''; psq.blur();
  if(!o) return;
  let reg, pts=[], pt=null, dist=null;
  if(o.kind==='c'){reg=o.c.region; pts=o.c.items; if(pts.length===1) pt=pts[0]}
  else if(o.kind==='p'){reg=o.p.region; pts=[o.p]; pt=o.p}
  else if(o.kind==='r'){reg=o.r.id; pts=PP.filter(p=>p.region===reg)}
  else {reg=o.d.region; pts=PP.filter(p=>p.region===reg); dist=o.d}
  if(pts.length&&!pm) setMode(true);
  if(pm&&pf&&!pts.some(pvis)) setFilter(null);
  if(pt){focusPartner(pt);return}
  openRegion(reg);
  if(dist&&!pm) setTimeout(()=>{if(!pm&&level===1&&cur===reg) openPop(dist)},980);
}
psq.addEventListener('input',runSearch);
psq.addEventListener('focus',runSearch);
psq.addEventListener('keydown',e=>{
  const bs=[...pres.querySelectorAll('button')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault(); if(!bs.length) return;
    resOn=(resOn+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;
    bs.forEach((b,i)=>b.classList.toggle('on',i===resOn));
  } else if(e.key==='Enter'){
    e.preventDefault(); pickRes(resList[resOn>=0?resOn:(psq.value.trim()?0:-1)]);
  } else if(e.key==='Escape'){
    e.stopPropagation(); psq.value=''; hideRes(); psq.blur();
  }
});
pres.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) pickRes(resList[+b.dataset.i])});
document.addEventListener('click',e=>{if(!e.target.closest('.psearch')) hideRes()});

  pm=!!on; closePop(); hideTip();

  tg.setAttribute('aria-checked',pm?'true':'false'); lgd.classList.toggle('pmode',pm); ctl.classList.toggle('pmode',pm);
  if(level===1) showRegionInfo(cur); else showDefaultInfo();
  render(); shine(pm?1:-1);
}

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(n=>{n.textContent=t(n.dataset.i18n)});
  psq.placeholder=t('ph'); psq.setAttribute('aria-label',t('aria_s')); svg.setAttribute('aria-label',t('map_aria'));

  PC.concat(PP).forEach(o=>{const n=(o.items||[o]).length; o.mk.setAttribute('aria-label',((PB[o.brand]||{}).name||'')+(n>1?': '+t('ptsn',{n:n}):''))});
  closePop(); hideTip(); hideRes();
  if(level===1) showRegionInfo(cur); else showDefaultInfo();
}
document.getElementById('lang').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.dataset.l===lang) return;
  lang=b.dataset.l; try{localStorage.setItem(LSK,lang)}catch(_){}
  track('lang'); applyLang(); dispatchEvent(new CustomEvent('lucento-lang',{detail:lang}));
});
addEventListener('lucento-lang',function(e){if(e.detail&&I[e.detail]&&e.detail!==lang){lang=e.detail;applyLang()}});
window.LUCENTO={
  enter:function(){shine(1,2200)},
  reset:function(){cancelAnimationFrame(raf);closePop();hideTip();
    if(level===1||q>0){level=0;cur=null;animRegion=null;q=0;vb=Object.assign({},base);grid.classList.remove('wide');svg.classList.remove('l1');svg.classList.add('l0');back.classList.remove('show');D.districts.forEach(function(d){d.el.classList.remove('sel')});showDefaultInfo();render()}}
};
applyLang(); render();
})();
</script>
<script>
/* ===== Стартовая страница и переход к карте ===== */
(function(){
var STATS={total:14,free:10,brands:7};   /* обновляйте вручную */
var T={
ru:{eyebrow:'Сеть партнёров LUCENTO',h1:'Сеть партнёров по <em>всему Узбекистану</em>',lead:'Найдите точки продаж и представителей LUCENTO в каждой области страны. В свободных регионах вы можете получить эксклюзивное право на сотрудничество с нами.',btn:'Карта партнёров и агентов',hint:'Откроется интерактивная карта Узбекистана',s1:'областей и регионов',s2:'свободных регионов',s3:'брендов-партнёров',title:'LUCENTO — Сеть партнёров'},
uz:{eyebrow:'LUCENTO hamkorlar tarmog‘i',h1:'<em>Butun O‘zbekiston</em> bo‘ylab hamkorlar tarmog‘i',lead:'Mamlakatning har bir viloyatidagi LUCENTO savdo nuqtalari va vakillarini toping. Bo‘sh hududlarda biz bilan hamkorlik qilish bo‘yicha eksklyuziv huquqqa ega bo‘lishingiz mumkin.',btn:'Hamkorlar va agentlar xaritasi',hint:'O‘zbekistonning interaktiv xaritasi ochiladi',s1:'viloyat va hududlar',s2:'bo‘sh hudud',s3:'hamkor brendlar',title:'LUCENTO — Hamkorlar tarmog‘i'},
en:{eyebrow:'LUCENTO partner network',h1:'A partner network across <em>all of Uzbekistan</em>',lead:'Find LUCENTO points of sale and representatives in every region of the country. In available regions you can secure exclusive rights to partner with us.',btn:'Partners & agents map',hint:'An interactive map of Uzbekistan will open',s1:'regions',s2:'available regions',s3:'partner brands',title:'LUCENTO — Partner network'}
};
var $=function(i){return document.getElementById(i)};
var lang='';try{lang=localStorage.getItem('lucento_lang')||''}catch(e){}
if(!T[lang]){var nl=String(navigator.language||'ru').slice(0,2).toLowerCase();lang=T[nl]?nl:'ru'}
function apply(){
  document.documentElement.lang=lang;document.title=T[lang].title;
  document.querySelectorAll('#landing [data-i]').forEach(function(n){n.innerHTML=T[lang][n.dataset.i]});
  document.querySelectorAll('#llang button').forEach(function(b){b.classList.toggle('on',b.dataset.l===lang)});
}
$('llang').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.dataset.l===lang)return;lang=b.dataset.l;try{localStorage.setItem('lucento_lang',lang)}catch(_){}apply();dispatchEvent(new CustomEvent('lucento-lang',{detail:lang}))});
addEventListener('lucento-lang',function(e){if(e.detail&&T[e.detail]&&e.detail!==lang){lang=e.detail;apply()}});
$('n1').textContent=STATS.total;$('n2').textContent=STATS.free;$('n3').textContent=STATS.brands;apply();

/* пульсирующие точки в городах партнёров */
(function(){var NS='http://www.w3.org/2000/svg',g=$('dots');
  [[41.30,69.24],[40.38,71.78],[39.65,66.96],[40.10,65.37],[41.38,60.36],[40.49,68.78],[39.77,64.42]].forEach(function(c,i){
    var x=(c[1]-55.99)*71.3,y=(45.57-c[0])*95.3+6,d=document.createElementNS(NS,'circle'),h=document.createElementNS(NS,'circle');
    d.setAttribute('class','dot');d.setAttribute('cx',x);d.setAttribute('cy',y);d.setAttribute('r',4);g.appendChild(d);
    h.setAttribute('class','halo');h.setAttribute('cx',x);h.setAttribute('cy',y);h.setAttribute('r',9);h.style.animationDelay=(i*.45)+'s';g.appendChild(h)})})();
/* тихий звёздный фон (на время перехода останавливается, чтобы ничто не мешало плавности) */
(function(){var c=$('stars'),x=c.getContext('2d'),W,H,S=[],run=false,L0=$('landing');
  function size(){var d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}
  size();addEventListener('resize',size);
  for(var i=0;i<130;i++)S.push({x:Math.random(),y:Math.random(),r:Math.random()*1.1+.2,p:Math.random()*6.28,f:Math.random()*.6+.2});
  var calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function f(t){x.clearRect(0,0,W,H);S.forEach(function(s){x.fillStyle='rgba(233,198,126,'+(.15+.35*(.5+.5*Math.sin(t/1000*s.f+s.p)))+')';x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,6.283);x.fill()});
    if(!calm&&!document.hidden&&!L0.classList.contains('going')&&!L0.classList.contains('off'))requestAnimationFrame(f);else run=false}
  window.__stars=function(){if(!run){run=true;requestAnimationFrame(f)}};
  document.addEventListener('visibilitychange',window.__stars);window.__stars()})();

/* переход: силуэт страны плавно «въезжает» ровно на своё место на карте */
var L=$('landing'),mv=$('mapview'),vs=$('vsvg'),isOpen=false,pushed=false,tm=[],fly=null,mapEl=$('map'),mapAnims=[];
var later=function(f,ms){tm.push(setTimeout(f,ms))},clear=function(){tm.forEach(clearTimeout);tm=[]};
function openMap(anim){
  if(isOpen)return;isOpen=true;clear();
  if(location.hash!=='#map'){history.pushState(null,'','#map');pushed=true}
  if(!anim){mv.style.transition='none';mv.classList.add('on');L.classList.add('off');
    requestAnimationFrame(function(){requestAnimationFrame(function(){mv.style.transition=''})});return}
  var M=$('map').getBoundingClientRect(),R=vs.getBoundingClientRect(),
      k=Math.min(M.width/1271,M.height/848),tw=1271*k,th=848*k,tx=M.left+(M.width-tw)/2,ty=M.top+(M.height-th)/2,s0=R.width/tw,sw=1.8/k,
      NS='http://www.w3.org/2000/svg',d=vs.querySelector('.uz').getAttribute('d'),DUR=2800,EASE='cubic-bezier(.55,0,.2,1)';
  /* «летящий» силуэт собран сразу в конечном размере и только уменьшен — поэтому линии остаются чёткими, а движение идёт на видеокарте (transform + opacity) */
  fly=document.createElementNS(NS,'svg');fly.setAttribute('id','fly');fly.setAttribute('viewBox','-24 -24 1271 848');
  fly.style.cssText='left:'+tx+'px;top:'+ty+'px;width:'+tw+'px;height:'+th+'px';
  [['rgba(233,198,126,.14)',sw*7],['rgba(233,198,126,.22)',sw*3],['#e9c67e',sw]].forEach(function(o){
    var q=document.createElementNS(NS,'path');q.setAttribute('d',d);q.setAttribute('fill','none');q.setAttribute('fill-rule','evenodd');q.setAttribute('stroke',o[0]);q.setAttribute('stroke-width',o[1]);q.setAttribute('stroke-linejoin','round');fly.appendChild(q)});
  document.body.appendChild(fly);
  var mv0='translate('+(R.left-tx)+'px,'+(R.top-ty)+'px) scale('+s0+')';
  /* золотой контур: едет и растёт вместе с картой, в самом конце плавно гаснет */
  fly.animate([{transform:mv0},{transform:'translate(0px,0px) scale(1)'}],{duration:DUR,easing:EASE,fill:'forwards'});
  fly.animate([{opacity:1},{opacity:1,offset:.5,easing:'cubic-bezier(.4,0,.6,1)'},{opacity:0}],{duration:DUR,easing:'linear',fill:'forwards'});
  /* сама карта: сразу стоит в границах силуэта, полностью прозрачная, затем растёт и проявляется */
  mapEl.style.transformOrigin=(tx-M.left)+'px '+(ty-M.top)+'px';
  mv.classList.add('on','enter');
  mapAnims=[
    mapEl.animate([{transform:mv0},{transform:'translate(0px,0px) scale(1)'}],{duration:DUR,easing:EASE,fill:'both'}),
    mapEl.animate([{opacity:0,easing:'cubic-bezier(.35,0,.35,1)'},{opacity:1,offset:.92},{opacity:1}],{duration:DUR,easing:'linear',fill:'both'})
  ];
  L.classList.add('going');
  later(function(){mv.classList.add('chrome')},1100);
  later(function(){endEnter();L.classList.add('off');dropFly()},DUR+80);
}
function endEnter(){mapAnims.forEach(function(a){a.cancel()});mapAnims=[];mapEl.style.transformOrigin='';mv.classList.remove('enter','chrome')}
function dropFly(){if(fly){fly.getAnimations().forEach(function(a){a.cancel()});fly.remove();fly=null}}
function closeMap(){
  if(!isOpen)return;isOpen=false;clear();dropFly();endEnter();
  if(window.LUCENTO)LUCENTO.reset();
  L.classList.remove('off');void L.offsetWidth;
  requestAnimationFrame(function(){L.classList.remove('going');window.__stars&&window.__stars()});
  mv.classList.remove('on');
}
$('cta').addEventListener('click',function(e){
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.button!==0)return;e.preventDefault();
  openMap(!matchMedia('(prefers-reduced-motion:reduce)').matches);
});
$('home').addEventListener('click',function(){
  if(pushed){pushed=false;history.back()}else{history.replaceState(null,'',location.pathname+location.search);closeMap()}
});
function sync(){var want=location.hash==='#map';if(want&&!isOpen)openMap(false);else if(!want&&isOpen){pushed=false;closeMap()}}
addEventListener('popstate',sync);addEventListener('hashchange',sync);
if(location.hash==='#map')openMap(false);
})();
</script>
